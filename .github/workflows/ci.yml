name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create Releases on tag pushes
  packages: write   # cache the toolchain image in GHCR (see "Toolchain image")

# A newer push to the same branch supersedes an in-flight build. Tags are never
# cancelled (each tag is its own group), so a release build always completes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The dev image compiles libogc2 + libfat from source, which costs ~10 min
      # on a cold runner. Nothing in it depends on repo sources, so it is cached
      # in GHCR under a tag derived from the Dockerfile hash: edit .ci/Dockerfile
      # and the tag changes and it rebuilds; otherwise every run just pulls it.
      # A pull or push failure (GHCR disabled/unreachable, fork without package
      # permissions) is not fatal -- the image is built locally instead.
      - name: Toolchain image
        env:
          REGISTRY: ghcr.io
        run: |
          set -euo pipefail
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="$REGISTRY/$OWNER/cubiboot-dev:${{ hashFiles('.ci/Dockerfile') }}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin || true

          if docker pull -q "$IMAGE" 2>/dev/null; then
            docker tag "$IMAGE" cubiboot-dev
            echo "::notice::reused cached toolchain image $IMAGE"
            exit 0
          fi

          # Cache miss. Retry the build: the Docker Hub base-image pull and the
          # libogc2/libfat clones can hit transient timeouts on runners.
          echo "::notice::toolchain cache miss, building $IMAGE"
          for i in 1 2 3 4 5; do
            if docker build -t cubiboot-dev - < .ci/Dockerfile; then
              docker tag cubiboot-dev "$IMAGE"
              docker push "$IMAGE" || echo "::warning::could not push $IMAGE; next run rebuilds"
              exit 0
            fi
            echo "docker build attempt $i failed; retrying in 20s..." >&2
            sleep 20
          done
          echo "docker build failed after 5 attempts" >&2
          exit 1

      # ipl.dol: the cubeboot loader. entry/ copies cubeboot/source/emu into
      # patches/, builds patches -> cubeboot -> the gzip self-extractor, so this
      # one step compiles every C source in the repo.
      - name: Build ipl.dol
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'cd entry && make clean && make'

      # apploader.img: Swiss In-Game-Reset redirect embedding the freshly built loader.
      - name: Build apploader.img
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_apploader.sh'

      # gbi.hdr: rebuild the disc apploader at -O1 (GCC 13 miscompiles the 2006
      # apploader at -O2 -> green screen) with the IPL animation hide+skip enabled
      # (PATCH_IPL=3 + IGNORE_BOOT_MODE=1), and regenerate gbi.hdr into the repo
      # root. Must run before build_iso.sh, which consumes <repo>/gbi.hdr.
      - name: Rebuild disc apploader + gbi.hdr
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_disc_apploader.sh'

      # cubiboot.iso: bootable GameCube disc image for GC Loader (and other ODEs).
      - name: Build cubiboot.iso
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_iso.sh'

      - name: Assemble release files
        run: |
          set -euo pipefail
          mkdir -p dist/swiss/patches
          cp cubeboot/cubeboot.dol dist/ipl.dol
          cp apploader.img         dist/swiss/patches/apploader.img
          cp cubiboot.iso          dist/cubiboot.iso
          # Default config.ini. cube_logo names a PNG the USER supplies on their
          # own SD card -- it is deliberately not shipped and the build must not
          # depend on it. cubiboot falls back to the stock wordmark when the file
          # is absent, so referencing it here is safe.
          cat > dist/config.ini <<'INI'
          [cubeboot]
          # Custom cube logo color - Supports RGB hex colors aka websafe colors
          # Keep the line commented out to use original logo color
          # Setting "random" shows a random color
          cube_color = random
          #660089

          # Enable booting through Swiss for all games
          force_swiss_default = 0

          # Force progressive scan inside the IPL menu
          force_progressive = 0

          # Disable MemCard PRO GC Support
          disable_mcp_select = 0

          # Used for waiting for GCVideo to initialize
          preboot_delay_ms = 0

          # Delays loading after the boot logo
          # to mimic the load times you would usually experience when booting a disc
          # postboot_delay_ms = 3000

          # Experimental configuration options below
          #
          # This enables folder icons and game icons which are still a little buggy
          # enable_experimental_png = 0
          #
          # This enables the cube logo feature which replaces the word 'GAMECUBE' on the boot animation
          cube_logo = logo.png
          INI
          # EXTRACT_TO_ROOT.zip: copy straight to the SD card root. Remove any
          # stale archive first -- `zip` ADDS to an existing file rather than
          # replacing it, so a leftover zip would ship files from an older build.
          rm -f EXTRACT_TO_ROOT.zip dist/EXTRACT_TO_ROOT.zip
          (cd dist && zip -r ../EXTRACT_TO_ROOT.zip ipl.dol config.ini swiss)
          cp EXTRACT_TO_ROOT.zip dist/EXTRACT_TO_ROOT.zip
          unzip -l EXTRACT_TO_ROOT.zip

      # cubiboot_picoloader.uf2: PicoLoader firmware with cubiboot.iso embedded.
      - name: Build cubiboot_picoloader.uf2
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 5 -o picoloader.uf2 https://makeo.github.io/PicoLoader/fw/picoloader.uf2
          python3 .ci/make_picoloader_uf2.py picoloader.uf2 dist/cubiboot.iso dist/cubiboot_picoloader.uf2

      # PicoBoot (webhdx) .uf2s -- the IPL-replacement modchip, a different product
      # from PicoLoader above. Payload is entry/entry.dol (linked at 0x81300000);
      # cubeboot.dol would be rejected. Needs network for the PicoBoot tools/release.
      - name: Build PicoBoot .uf2 files
        run: docker run --rm -v "$PWD":/work cubiboot-dev bash -lc 'bash /work/.ci/build_picoboot_uf2.sh'

      # Every artifact must exist and be non-empty before we call the build green:
      # build_picoboot_uf2.sh deliberately downgrades a failed PicoBoot release
      # fetch to a warning, so a missing full image would otherwise ship silently
      # as a partial upload.
      - name: Verify artifacts
        run: |
          set -euo pipefail
          MISSING=0
          for f in dist/ipl.dol dist/swiss/patches/apploader.img dist/config.ini \
                   dist/cubiboot.iso dist/cubiboot_picoloader.uf2 \
                   dist/cubiboot_picoboot_payload.uf2 dist/cubiboot_picoboot_pico.uf2 \
                   dist/cubiboot_picoboot_pico2.uf2 dist/EXTRACT_TO_ROOT.zip; do
            if [ ! -s "$f" ]; then
              echo "ERROR: missing or empty artifact: $f" >&2
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          {
            echo "### cubiboot artifacts (\`${GITHUB_SHA:0:7}\`)"
            echo
            echo "| file | bytes | sha256 |"
            echo "|---|---:|---|"
            find dist -type f | sort | while read -r f; do
              printf '| `%s` | %s | `%s` |\n' \
                "${f#dist/}" "$(stat -c%s "$f")" "$(sha256sum "$f" | cut -c1-16)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cubiboot-${{ github.sha }}
          retention-days: 30
          path: |
            dist/ipl.dol
            dist/swiss/patches/apploader.img
            dist/config.ini
            dist/cubiboot.iso
            dist/cubiboot_picoloader.uf2
            dist/cubiboot_picoboot_payload.uf2
            dist/cubiboot_picoboot_pico.uf2
            dist/cubiboot_picoboot_pico2.uf2
            dist/EXTRACT_TO_ROOT.zip

      # On a tag push (v*), publish a GitHub Release with the artifacts.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ipl.dol
            dist/swiss/patches/apploader.img
            dist/config.ini
            dist/cubiboot.iso
            dist/cubiboot_picoloader.uf2
            dist/cubiboot_picoboot_payload.uf2
            dist/cubiboot_picoboot_pico.uf2
            dist/cubiboot_picoboot_pico2.uf2
            dist/EXTRACT_TO_ROOT.zip
